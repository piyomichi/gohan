<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ごはん記録</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f5f5f7;
  color:#111;
}

/* ヘッダー */
header{
  text-align:center;
  padding:20px;
  font-size:22px;
  font-weight:600;
  background:white;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid #eee;
}

/* タグフィルター */
.filters{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:15px;
  background:white;
}

.filters button{
  border:none;
  background:#eee;
  padding:8px 14px;
  border-radius:20px;
  cursor:pointer;
  font-size:13px;
  transition:0.2s;
}

.filters button:hover{
  background:#111;
  color:white;
}

/* 投稿グリッド */
.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:30px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,0.05);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-4px);
}

.main-img{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  cursor:pointer;
}
/* ===== メイン画像をスワイプ対応にする ===== */

.image-slider{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}

.image-slider img{
  width:100%;
  flex-shrink:0;
  scroll-snap-align:start;
  aspect-ratio:4/3;
  object-fit:cover;
  cursor:pointer;
}

/* スクロールバー非表示（スマホ用） */
.image-slider::-webkit-scrollbar{
  display:none;
}
.sub-images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
}

.sub-images img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  cursor:pointer;
}

.text{
  padding:18px;
}

.text h3{
  margin:0 0 6px 0;
}

.meta{
  font-size:13px;
  color:#666;
}

.tags{
  margin-top:8px;
  font-size:12px;
  color:#999;
}

/* 地図ボタン */
.map-btn{
  display:inline-block;
  margin-top:10px;
  padding:6px 12px;
  background:#111;
  color:white;
  text-decoration:none;
  border-radius:20px;
  font-size:12px;
}

/* モーダル */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:1000;
}
.modal img{
  max-width:90%;
  max-height:90%;
  border-radius:14px;
}.image-wrapper {
  overflow: hidden;
}

.image-slider {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}

.image-slider img {
  width: 100%;
  flex-shrink: 0;
  scroll-snap-align: start;
  aspect-ratio: 4/3;
  object-fit: cover;
}

/* スクロールバー非表示 */
.image-slider::-webkit-scrollbar {
  display: none;
}
</style>
</head>

<body>

<header>🍙 ごはん記録</header>

<!-- タグフィルター -->
<div class="filters">
  <button onclick="filterPosts('all')">すべて</button>
  <button onclick="filterPosts('和食')">和食</button>
  <button onclick="filterPosts('カフェ')">カフェ</button>
  <button onclick="filterPosts('横浜')">横浜</button>
</div>

<div class="container">

  <!-- 投稿例 -->
  <div class="card" data-tags="和食 横浜">

  <div class="image-slider">
  <img src="images/shinryoku1.jpg" onclick="openModal(this.src)">
  <img src="images/shinryoku2.jpg" onclick="openModal(this.src)">
  <img src="images/shinryoku3.jpg" onclick="openModal(this.src)">
</div>

    <div class="sub-images">
      <img src="images/shinryoku2.jpg" onclick="openModal(this.src)">
      <img src="images/shinryoku3.jpg" onclick="openModal(this.src)">
    </div>

    <div class="text">
      <h3>おにぎり割烹 新緑</h3>
      <div class="meta">石川町｜鯛茶漬けセット ¥1,680</div>
      <div class="tags">#和食 #横浜</div>

      <a class="map-btn" 
         href="https://www.google.com/maps/search/?api=1&query=石川町+おにぎり割烹+新緑"
         target="_blank">
         📍 地図を見る
      </a>
    </div>

  </div>

</div>

<!-- モーダル -->
<div class="modal" id="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<script>
function openModal(src){
  document.getElementById("modal").style.display="flex";
  document.getElementById("modalImg").src=src;
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}

function filterPosts(tag){
  const cards=document.querySelectorAll(".card");
  cards.forEach(card=>{
    if(tag==="all"){
      card.style.display="block";
    }else{
      const tags=card.dataset.tags;
      card.style.display=tags.includes(tag)?"block":"none";
    }
  });
}
</script>

</body>
</html>
