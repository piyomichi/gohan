<style>
body{

/* ヘッダー */
header{

  padding:20px;
  font-size:22px;
  font-weight:600;
  background:white;
  position:sticky;

  z-index:100;

}
 /* ↓サブタイトルのサイズ */
  .subtitle{

  margin-top:6px;
  color:#777;
  letter-spacing:1px;
}


header{
  position:sticky;
  top:0;
  background:white;
  z-index:1000;
  padding:20px 10px 10px;
}
.search-box{
  margin-top:10px;
}

.filters{

/* タグフィルター */
  
.filters{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:15px;
  background:white;
}

.filters button{

  padding:8px 14px;

  cursor:pointer;
  font-size:13px;
  transition:0.2s;
}

.filters button:hover{
  background:#111;

}

/* 投稿グリッド */

    /* 横並び投稿 */  
.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:30px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,0.05);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-4px);
}

.main-img{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  cursor:pointer;
}

.sub-images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
}

.sub-images img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  cursor:pointer;
}

.text{
  padding:18px;
}

.text h3{
  margin:0 0 6px 0;
}

.meta{
  font-size:13px;
  color:#666;
}

.tags{
  margin-top:8px;
  font-size:12px;
  color:#999;
}

/* 地図ボタン */
.map-btn{
  display:inline-block;
  margin-top:10px;
  padding:6px 12px;
  background:#111;
  color:white;
  text-decoration:none;
  border-radius:20px;
  font-size:12px;
}

/* モーダル */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:1000;
}
.modal img{
  max-width:90%;
  max-height:90%;
  border-radius:14px;
}
/* ===== モーダルスライダー ===== */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.modal-slider{
  display:flex;
  flex-direction:row;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  width:100%;
  height:100%;
}

.modal-slider img{
  flex:0 0 100%;
  max-width:100%;
  object-fit:contain;
  scroll-snap-align:center;
}

.modal-slider::-webkit-scrollbar{
  display:none;
}  
  /* 閉じるボタン */

.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  background:rgba(255,255,255,0.2);
  color:white;
  border:none;
  font-size:28px;
  width:44px;
  height:44px;
  border-radius:50%;
  cursor:pointer;
  backdrop-filter:blur(6px);
}

.close-btn:hover{
  background:rgba(255,255,255,0.4);
}
 /* 日付の大きさ */ 
.date{
  font-size:0.6em;
  color:#999;
  margin:5px 0 10px 0;
}
  


  .main-slider{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
}

  /* スワイプ↓ */  
  
.main-slider img{
  flex:0 0 100%;
  width:100%;
  height:250px;
  object-fit:cover;
  scroll-snap-align:start;
}

.main-slider::-webkit-scrollbar{
  display:none;
}

  
.search-box{
  text-align:center;
  margin:20px;
}

.search-box input{
  width:300px;
  max-width:80%;
  padding:10px 14px;
  border-radius:20px;
  border:1px solid #ddd;
  font-size:14px;
}

.by{
  font-size:0.55em;
  color:#888;
  margin-top:4px;
}

    /* kimononoiroirohijiriの字体↓ */  
.by{
  font-size:0.55em;
  color:#888;
  margin-top:8px;
}

.by a:hover{
  text-decoration:underline;
}

.hidden-images{
  display:none;
}

  .modal-slider{
  -webkit-overflow-scrolling:touch;
}
  
</style>
   
</head>
 
<body>

<div class="container">

 <div class="card" data-tags="高円寺">

<!-- モーダル -->
<div class="modal" id="modal">
  <button class="close-btn" onclick="closeModal()">×</button>
  <div class="modal-slider" id="modalSlider"></div>
</div>
<script>

let currentImages = [];

function openModal(clickedSrc){
  const modal = document.getElementById("modal");
  const slider = document.getElementById("modalSlider");

  // 同じカード内の画像を取得
  const card = event.target.closest(".card");
  const imgs = card.querySelectorAll(".main-img, .hidden-images img");
  currentImages = [];
  slider.innerHTML = "";

  imgs.forEach(img=>{
    currentImages.push(img.src);
    const newImg = document.createElement("img");
    newImg.src = img.src;
    slider.appendChild(newImg);
  });

  modal.style.display = "flex";

  // クリックした画像の位置へスクロール
  const index = currentImages.indexOf(clickedSrc);
  slider.scrollLeft = slider.clientWidth * index;
}

// モーダルを閉じる
document.getElementById("modal").addEventListener("click",function(e){
  if(e.target.id === "modal"){
    this.style.display = "none";
  }
});

// タグフィルター（そのまま）
function filterPosts(tag){
  const cards=document.querySelectorAll(".card");
  cards.forEach(card=>{
    if(tag==="all"){
      card.style.display="block";
    }else{
      const tags=card.dataset.tags;
      card.style.display=tags.includes(tag)?"block":"none";
    }
  });
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}


function searchPosts(){
  const keyword = document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  const cards = document.querySelectorAll(".card");

  cards.forEach(card=>{
    const text = card.innerText.toLowerCase();

    if(text.includes(keyword)){
      card.style.display="block";
    }else{
      card.style.display="none";
    }
  });
}


const slider = document.getElementById("modalSlider");

let isDown = false;
let startX;
let scrollLeft;

slider.addEventListener("mousedown", (e)=>{
  isDown = true;
  startX = e.pageX - slider.offsetLeft;
  scrollLeft = slider.scrollLeft;
});

slider.addEventListener("mouseleave", ()=>{
  isDown = false;
});

slider.addEventListener("mouseup", ()=>{
  isDown = false;
});

slider.addEventListener("mousemove", (e)=>{
  if(!isDown) return;
  e.preventDefault();
  const x = e.pageX - slider.offsetLeft;
  const walk = (x - startX) * 2;
  slider.scrollLeft = scrollLeft - walk;
});
  

slider.addEventListener("dragstart", e => e.preventDefault());
  
</script>
</body>
