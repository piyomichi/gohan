<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>おすすめお店まとめ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #8B5A2B;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .shop-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: 0.2s;
    }

    .shop-card:hover {
      transform: translateY(-3px);
    }

    .shop-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .shop-image {
      width: 100%;
      border-radius: 10px;
      margin: 10px 0;
    }

    .shop-info {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .map-button {
      display: inline-block;
      background: #4CAF50;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

<header>
  🍙 おすすめお店アーカイブ
</header>

<div class="container">

  <!-- ▼ 店舗カード（ここをコピーして増やせます） -->
  <div class="shop-card">
    <div class="shop-title">おにぎり割烹 新緑（石川町）</div>
    
    <img src="images/shinryoku.jpg" class="shop-image" alt="新緑">

    <div class="shop-info">
      鯛茶漬けセット（1,680円）<br>
      唐揚げ＆だし巻き卵が大きくて満足度◎<br>
      店内きれい・コンセントあり・お茶セルフ
    </div>

    <a href="https://www.google.com/maps/search/?api=1&query=石川町+おにぎり割烹+新緑" 
       target="_blank" 
       class="map-button">
       📍 地図を見る
    </a>
  </div>
  <!-- ▲ 店舗カードここまで -->

</div>

<footer>
  © 2026 おすすめお店まとめ
</footer>

</body>
</html>
