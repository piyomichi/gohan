<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ごはん記録</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#fafafa;
}

/* ヘッダー */
header{
  text-align:center;
  padding:20px 0;
  font-size:22px;
  font-weight:bold;
  background:white;
  border-bottom:1px solid #eee;
}

/* ストーリーズ */
.stories{
  display:flex;
  overflow-x:auto;
  gap:15px;
  padding:15px;
  background:white;
}
.story{
  text-align:center;
  font-size:12px;
}
.story img{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff8501;
}

/* 投稿グリッド */
.container{
  max-width:1000px;
  margin:30px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:30px;
}

.card{
  background:white;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,0.06);
  overflow:hidden;
}

/* 画像レイアウト */
.main-img{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  cursor:pointer;
}

.sub-images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
}

.sub-images img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  cursor:pointer;
}

.text{
  padding:15px;
}

.text h3{
  margin:0 0 8px 0;
}

.text p{
  margin:0;
  font-size:14px;
  color:#555;
}

/* 画像拡大モーダル */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:1000;
}
.modal img{
  max-width:90%;
  max-height:90%;
  border-radius:12px;
}
</style>
</head>

<body>

<header>🍙 ごはん記録</header>

<!-- ストーリーズ風 -->
<div class="stories">
  <div class="story">
    <img src="images/shinryoku1.jpg">
    <div>新緑</div>
  </div>
  <div class="story">
    <img src="images/shinryoku1.jpg">
    <div>カフェ</div>
  </div>
</div>

<!-- 投稿エリア -->
<div class="container">

  <!-- 投稿1 -->
  <div class="card">

    <img src="images/shinryoku1.jpg" class="main-img" onclick="openModal(this.src)">

    <div class="sub-images">
      <img src="images/shinryoku2.jpg" onclick="openModal(this.src)">
      <img src="images/shinryoku3.jpg" onclick="openModal(this.src)">
    </div>

    <div class="text">
      <h3>おにぎり割烹 新緑</h3>
      <p>石川町｜鯛茶漬けセット ¥1,680</p>
      <p style="margin-top:6px; font-size:12px; color:#888;">#和食 #横浜</p>
    </div>

  </div>


  <!-- 投稿を増やすときはこのcardをコピー -->

</div>

<!-- モーダル -->
<div class="modal" id="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<script>
function openModal(src){
  document.getElementById("modal").style.display="flex";
  document.getElementById("modalImg").src=src;
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
