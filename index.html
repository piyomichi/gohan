<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>おすすめお店まとめ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #8B5A2B;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .shop-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: 0.2s;
    }

    .shop-card:hover {
      transform: translateY(-3px);
    }

    .shop-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .shop-image {
      width: 100%;
      border-radius: 10px;
      margin: 10px 0;
    }

    .shop-info {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .map-button {
      display: inline-block;
      background: #4CAF50;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>


<body style="margin:0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#fafafa;">

  <h1 style="text-align:center; padding:20px 0; margin:0;">
    🍙 ごはん記録
  </h1>

  <div style="
    max-width:1000px;
    margin:0 auto;
    padding:20px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px,1fr));
    gap:30px;
  ">

    <!-- 投稿カード -->
    <div style="
      background:white;
      border-radius:16px;
      box-shadow:0 4px 20px rgba(0,0,0,0.06);
      overflow:hidden;
    ">

      <!-- 画像エリア -->
      <div style="
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap:5px;
      ">

        <img src="images/shinryoku1.jpg"
             style="width:100%; aspect-ratio:1/1; object-fit:cover;">

        <img src="images/shinryoku2.jpg"
             style="width:100%; aspect-ratio:1/1; object-fit:cover;">

        <img src="images/shinryoku3.jpg"
             style="width:100%; aspect-ratio:1/1; object-fit:cover; grid-column: span 2;">
      </div>

      <!-- テキストエリア -->
      <div style="padding:15px;">

        <h3 style="margin:0 0 8px 0;">おにぎり割烹 新緑</h3>

        <p style="margin:0; color:#555; font-size:14px;">
          石川町｜鯛茶漬けセット ¥1,680
        </p>

        <p style="margin-top:8px; font-size:12px; color:#888;">
          #和食 #横浜
        </p>

      </div>
    </div>

  </div>

</body>
</html>
