<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>おすすめお店まとめ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #8B5A2B;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .shop-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: 0.2s;
    }

    .shop-card:hover {
      transform: translateY(-3px);
    }

    .shop-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .shop-image {
      width: 100%;
      border-radius: 10px;
      margin: 10px 0;
    }

    .shop-info {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .map-button {
      display: inline-block;
      background: #4CAF50;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

<div style="max-width:900px; margin:40px auto;">

  <h2 style="text-align:center;">おにぎり割烹 新緑</h2>

  <div style="
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap:10px;
    margin-top:20px;
  ">

    <img src="images/shinryoku1.jpg"
         style="width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px;">

    <img src="images/shinryoku2.jpg"
         style="width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px;">

    <img src="images/shinryoku3.jpg"
         style="width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px;">

  </div>

  <p style="text-align:center; margin-top:15px;">
    石川町｜鯛茶漬けセット ¥1,680
  </p>

</div>
</body>
</html>
